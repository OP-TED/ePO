name: transform ePO and ePO modules XMIs
on:
  push:
    branches:
      - "**"
      - "!develop"
      - "!master"
    # paths:
    #   - "implementation/ePO_core/xmi_conceptual_model/ePO_core.xml"
    #   - "implementation/eCatalogue/xmi_conceptual_model/eCatalogue.xml"
    #   - "implementation/eNotice/xmi_conceptual_model/eNotice.xml"
    #   - "implementation/eOrdering/xmi_conceptual_model/eOrdering.xml"
    #   - "implementation/eFulfilment/xmi_conceptual_model/eFulfilment.xml"
    #   - "implementation/eContract/xmi_conceptual_model/eContract.xml"
    #   - "implementation/eInvoicing/xmi_conceptual_model/eInvoicing.xml"
    #   - "implementation/eAccess/xmi_conceptual_model/eAccess.xml"
    #   - "implementation/eSubmission/xmi_conceptual_model/eSubmission.xml"
    #   - "implementation/eEvaluation/xmi_conceptual_model/eEvaluation.xml"
    #   - "implementation/eAwarding/xmi_conceptual_model/eAwarding.xml"
    #   - "implementation/eQualification/xmi_conceptual_model/eQualification.xml"
    #   - "implementation/eRequest/xmi_conceptual_model/eRequest.xml"

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.ref }}

      - name: get model2owl
        run: |
          git clone --branch reused-terms-bug https://github.com/OP-TED/model2owl.git
          pwd

      - name: get-saxon
        run: pwd && cd model2owl && make get-saxon

      - name: get-rdflib
        run: cd model2owl && make create-virtual-env && make get-rdflib

      - name: transform step
        run: |
          AVAILABLE_IMPLEMENTATIONS=(eInvoicing eOrdering eFulfilment eCatalogue eNotice eContract eAccess eSubmission ePO_core eAwarding eEvaluation eQualification eRequest)
          for implementation in "${AVAILABLE_IMPLEMENTATIONS[@]}"
          do
            echo "-------------------${implementation} transform---------------------------------"
            sed -i "s/test\/ePO-default-config/..\/implementation\/${implementation}\/model2owl-config/g" model2owl/config-proxy.xsl
            cat model2owl/config-proxy.xsl


            CM_FILE_NAME=$(echo "${implementation}.xml")
            NS_XML_FILE_PATH="../implementation/${implementation}/model2owl-config/namespaces.xml"
            CM_FILE_PATH=$(echo "implementation/$implementation/xmi_conceptual_model/${CM_FILE_NAME}")
            OUTPUT_PATH_OWL=$(echo "implementation/$implementation/owl_ontology/")
            OUTPUT_PATH_SHACL=$(echo "implementation/$implementation/shacl_shapes/")

            ls -la implementation/$implementation/xmi_conceptual_model/
            echo "CM_FILE_PATH is $CM_FILE_PATH"
            echo "NS_XML_FILE_PATH is $NS_XML_FILE_PATH"
            echo "OUTPUT_PATH_OWL is $OUTPUT_PATH_OWL"
            echo "OUTPUT_PATH_SHACL is $OUTPUT_PATH_SHACL"


            cd model2owl
            ls -la
            echo "+++++++++++++++++transform to rdf++++++++++++++++++++++++++++"
            make owl-core \
              XMI_INPUT_FILE_PATH=../$CM_FILE_PATH \
              OUTPUT_FOLDER_PATH=../$OUTPUT_PATH_OWL \
              NAMESPACES_USER_XML_FILE_PATH=${NS_XML_FILE_PATH}
            make owl-restrictions \
              XMI_INPUT_FILE_PATH=../$CM_FILE_PATH \
              OUTPUT_FOLDER_PATH=../$OUTPUT_PATH_OWL \
              NAMESPACES_USER_XML_FILE_PATH=${NS_XML_FILE_PATH}
            make shacl \
              XMI_INPUT_FILE_PATH=../$CM_FILE_PATH \
              OUTPUT_FOLDER_PATH=../$OUTPUT_PATH_SHACL \
              NAMESPACES_USER_XML_FILE_PATH=${NS_XML_FILE_PATH}

            echo "+++++++++++++++++transform to turtle++++++++++++++++++++++++++++"
            echo $(ls ${OUTPUT_PATH_OWL}*.rdf)
            make convert-rdf-to-turtle \
              ONTOLOGY_FOLDER_PATH=../$OUTPUT_PATH_OWL \
              NAMESPACES_USER_XML_FILE_PATH=${NS_XML_FILE_PATH}
            echo $(ls ${OUTPUT_PATH_SHACL}*.rdf)
            make convert-rdf-to-turtle \
              ONTOLOGY_FOLDER_PATH=../$OUTPUT_PATH_SHACL \
              NAMESPACES_USER_XML_FILE_PATH=${NS_XML_FILE_PATH}
            echo "-------------------end transform---------------------------------"

            sed -i "s/..\/implementation\/${implementation}\/model2owl-config/test\/ePO-default-config/g" config-proxy.xsl
            cd ..
          done
        shell: bash

      - name: remove unnecessary files
        run: |
          sudo rm -rf model2owl
        shell: bash

      - name: commit files
        id: commit
        run: |
               git config --local user.email "action@github.com"
               git config --local user.name "github-actions"
               git pull
               git status

               git add .
               if [ -z "$(git status --porcelain)" ]; then
               echo "::set-output name=push::false"
               else
               git commit -m "Adding transformation files"
               echo "::set-output name=push::true"
               fi
        shell: bash

      - name: Push changes
        if: steps.commit.outputs.push == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
  test_bugfix:
    needs: transform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.ref }}

      - name: get model2owl
        run: |
          git clone --branch reused-terms-bug https://github.com/OP-TED/model2owl.git
          pwd

      - name: get-rdflib
        run: cd model2owl && make create-virtual-env && make get-rdflib

      - name: testing step
        run: |
          AVAILABLE_IMPLEMENTATIONS=(eInvoicing eOrdering eFulfilment eCatalogue eNotice eContract eAccess eSubmission ePO_core eAwarding eEvaluation eQualification eRequest)
          for implementation in "${AVAILABLE_IMPLEMENTATIONS[@]}"
          do
            echo "-------------------${implementation} test---------------------------------"
            sed -i "s/test\/ePO-default-config/..\/implementation\/${implementation}\/model2owl-config/g" model2owl/config-proxy.xsl
            cat model2owl/config-proxy.xsl
            OUTPUT_PATH_OWL=$(echo "implementation/$implementation/owl_ontology/")

            ls -la implementation/$implementation/xmi_conceptual_model/
            echo "OUTPUT_PATH_OWL is $OUTPUT_PATH_OWL"

            cd model2owl
            ls -la
            echo "++++++++++++++++++++++++test+++++++++++++++++++++++++++++++++++"
            source model2owl-venv/bin/activate && \
            python3 test/reused-concepts-bugfix-testing/detect_reused_uris.py \
              ../$OUTPUT_PATH_OWL/${implementation}_restrictions.ttl
            echo "---------------------end test----------------------------------"

            sed -i "s/..\/implementation\/${implementation}\/model2owl-config/test\/ePO-default-config/g" config-proxy.xsl
            cd ..
          done
        shell: bash

      - name: remove unnecessary files
        run: |
          sudo rm -rf model2owl
        shell: bash
